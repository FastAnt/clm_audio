[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samsone-clm"
version = "0.1.0"
license = "Apache-2.0"
description = "Frozen Samsone with a shared adapter and official pretrained CLM heads"
requires-python = ">=3.12"
dependencies = [
  "torch==2.11.0", "torchaudio==2.11.0", "transformers==4.57.6",
  "torchcodec==0.11.0", "lightning==2.5.6", "torchmetrics==1.8.2", "jsonargparse[signatures]",
  "numpy", "requests", "soundfile", "safetensors", "pyyaml", "pyarrow",
  "fastapi", "uvicorn", "python-multipart", "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
samsone-clm-infer = "samsone_clm.infer:main"
samsone-clm-serve = "samsone_clm.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
samsone_clm = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
